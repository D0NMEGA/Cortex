# XcodeGen declarative spec -- generates Cortex.xcodeproj and Cortex.xcworkspace.
# Source of truth for: target topology (D-01..D-04), bundle IDs (D-05..D-07),
# App Group entitlement scope (D-07), Mac Catalyst opt-out (D-01), and SwiftPM
# consumption (D-02). PrivacyInfo.xcprivacy paths included in sources: lists per
# Plan 01-03 cross-phase note (RESEARCH.md Pitfall #7).
#
# Regenerate with: xcodegen
# Both .xcodeproj and .xcworkspace are gitignored -- never commit them.
#
# References:
#   .planning/phases/01-foundation-2026-toolchain/01-CONTEXT.md (D-01..D-16)
#   .planning/phases/01-foundation-2026-toolchain/01-RESEARCH.md Q1, Q3, Q4 / Critical Finding #1, #4
#   docs/adr/0001-foundation-and-2026-toolchain.md (ADR-0001)
name: Cortex

options:
  bundleIdPrefix: com.donovansantine.cortex
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # Disabled to keep validate-privacy-manifest.sh runnable from build phases if ever needed.

packages:
  CortexCore:
    path: Packages/CortexCore
  CortexIPC:
    path: Packages/CortexIPC
  CortexRender:
    path: Packages/CortexRender
  CortexDecoder:
    path: Packages/CortexDecoder
  # Phase 3 Swift↔Rust FFI spine (D-R1). Consumes CortexRingFFI.xcframework via a SwiftPM
  # .binaryTarget; the xcframework is built by Tools/scripts/build-rust.sh (gitignored, the
  # `make bootstrap` analogue) BEFORE `xcodegen`/`swift package resolve`. The hot-path TARGET that
  # depends on CortexRingPing is added in Plan 03; registering the package here proves the
  # xcodebuild leg of Spike A resolves the binaryTarget end-to-end (CortexMac builds transitively).
  CortexRing:
    path: Packages/CortexRing

targets:
  CortexiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/CortexiOS
    dependencies:
      - package: CortexCore
      - package: CortexRender             # Phase 6: the 120Hz CAMetalDisplayLink webgrid renderer (RENDER-01/02/04/06/07).
    info:
      path: Apps/CortexiOS/Info.plist
      properties:
        CFBundleDisplayName: Cortex
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # CADisableMinimumFrameDurationOnPhone arrives in Phase 6 with the renderer.
    entitlements:
      path: Apps/CortexiOS/Cortex.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.donovansantine.cortex.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donovansantine.cortex.ios
        TARGETED_DEVICE_FAMILY: "2"        # iPad only (1=iPhone, 2=iPad). iPhone explicitly out of scope.
        DEVELOPMENT_TEAM: 57YW6M29S7        # Personal Team auto-signs locally; CI uses CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  CortexMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/CortexMac
    dependencies:
      - package: CortexCore
      - package: CortexRender               # Phase 6: the 120Hz NSView.displayLink webgrid renderer (RENDER-08/02/04/06/07).
      - target: CortexDaemon                # Build the daemon bundle as a peer artifact when CortexMac builds.
    info:
      path: Apps/CortexMac/Info.plist
      properties:
        CFBundleDisplayName: Cortex
        LSUIElement: false
        NSPrincipalClass: NSApplication
    entitlements:
      path: Apps/CortexMac/Cortex.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.donovansantine.cortex.shared
        # NOT enabling the app sandbox entitlement in Phase 1.
        # Per RESEARCH.md Critical Finding #1: unsandboxed Mac binaries can use the App
        # Group container without provisioning-profile authorization. Sandbox is added
        # in Phase 8 with paid Developer Program enrollment. Do not change this without
        # updating ADR-0001.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donovansantine.cortex.mac
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SUPPORTS_MACCATALYST: NO            # Defense-in-depth against accidental Catalyst (RENDER-08).
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DEVELOPMENT_TEAM: 57YW6M29S7
        CODE_SIGN_STYLE: Automatic

  CortexDaemon:
    type: tool                              # Standalone command-line executable (mh_execute).
                                            # Was type: bundle (D-03), but an mh_bundle cannot run
                                            # standalone (`cannot execute binary file`) nor carry
                                            # entitlements -- it is dlopen'd by a host. A daemon is
                                            # its own process, so D-03's functional requirement
                                            # (cross-process shm_open from the daemon, App Group
                                            # entitlement honored = Phase 1 SC#2) requires mh_execute.
                                            # Resolves the disposition Plan 01-02 deferred to Xcode 26
                                            # (Critical Finding #4 / RESEARCH Pitfall #6). Final
                                            # App-Store daemon packaging (XPC service / launchd helper)
                                            # is a Phase 2 decision -- a bare tool is not App-Store-shippable.
    platform: macOS
    sources:
      - path: Apps/CortexDaemon
    dependencies:
      - package: CortexCore
      # Phase 2 (Plan 02-04): the daemon is the producer + posix_spawn'd consumer. Producer.swift /
      # main.swift import the Foundation-free transport AND the session layer; the CortexIPC package
      # exposes two products (the bare CortexIPC product was split in Plan 02-01), so depend on both.
      - package: CortexIPC
        product: CortexIPCTransport
      - package: CortexIPC
        product: CortexIPCSession
      # Phase 3 (Plan 03-03): the daemon hosts the acquisition producer — the Foundation-free
      # pthread USER_INTERACTIVE worker (CortexRingHotPath) that pushes CortexFrames into the Rust
      # SPSC ring over the C ABI. The CortexRing package is already registered under packages:
      # (Plan 01); this links the hot-path product + the CortexRingFFI xcframework into the daemon.
      # The iOS/Mac app targets do NOT depend on it yet — wiring frames into the app UI is the
      # Phase-6 consumer (RENDER SC#4), driven from a CAMetalDisplayLink callback.
      - package: CortexRing
        product: CortexRingHotPath
    entitlements:
      path: Apps/CortexDaemon/Cortex.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.donovansantine.cortex.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donovansantine.cortex.daemon
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        DEVELOPMENT_TEAM: 57YW6M29S7
        CODE_SIGN_STYLE: Automatic

schemes:
  CortexiOS:
    build:
      targets:
        CortexiOS: all
    run:
      config: Debug
    test:
      config: Debug
  CortexMac:
    build:
      targets:
        CortexMac: all
        CortexDaemon: all
    run:
      config: Debug
      executable: CortexMac        # Launch the .app window, not the daemon (XcodeGen defaults run to the first runnable target = CortexDaemon alphabetically). Daemon still builds as a peer above.
    test:
      config: Debug
  CortexDaemon:
    build:
      targets:
        CortexDaemon: all
    run:
      config: Debug
