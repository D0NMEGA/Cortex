# Source: project-defined per CONTEXT.md D-13/D-14/D-15/D-16 and RESEARCH.md Q2/Q3/Q10.
# Purpose: PR-blocking CI gate for Cortex.app on macos-15 + Xcode 26.3.
#
# Critical pins:
#   - runs-on: macos-26           REQUIRED for build-and-lint. Every Package.swift declares
#                                 platforms: [.macOS(.v26), .iOS(.v26)], so binaries built against
#                                 the Xcode 26.3 SDK need the macOS 26 Swift runtime. On macos-15
#                                 they COMPILE and then die at test time with
#                                 `Library not loaded: /usr/lib/swift/libswift_DarwinFoundation1.dylib`
#                                 (first observed 2026-09-07, run 34154714318, CortexIPC tests).
#                                 The earlier note that macos-15 was the only image with Xcode 26.x
#                                 was true when Phase 1 wrote it; macos-26-arm64 shipped 2026-08-31.
#                                 decoder-python stays on macos-15 deliberately: it is pure Python,
#                                 it passes there, and moving it is not this fix's business.
#   - setup-xcode@v1, version 26.3 (default xcodebuild on macos-15 is 16.4 -- explicit pin required)
#   - CODE_SIGNING_ALLOWED=NO     (CI cannot sign; build is compile-only smoke)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Print versions
        run: |
          echo '=== Xcode ==='
          xcodebuild -version
          echo '=== Swift ==='
          swift --version
          echo '=== macOS ==='
          sw_vers

      - name: Verify Xcode is 26.x (Critical Finding #3)
        run: |
          XV=$(xcodebuild -version | head -1)
          case "$XV" in
            "Xcode 26."*) echo "OK: $XV" ;;
            *) echo "ERROR: expected Xcode 26.x, got: $XV" >&2; exit 1 ;;
          esac

      - name: Install tooling
        run: |
          set -euo pipefail
          # shellcheck source=Tools/toolchain-versions.env
          . Tools/toolchain-versions.env
          brew update >/dev/null
          brew install xcodegen swiftformat swiftlint xcbeautify
          echo "swiftformat: $(swiftformat --version)  (pinned: ${SWIFTFORMAT_VERSION})"
          echo "swiftlint:   $(swiftlint version)      (pinned: ${SWIFTLINT_VERSION})"

      # --- Phase 10 (D-18): the lint toolchain is brew-installed and therefore UNPINNED. The
      # SwiftFormat/SwiftLint verdict below is only comparable to the committed 10-lint-baseline.md
      # if the runner is on the versions the sweep was measured under. This gate asserts that and
      # fails loudly on drift. It sits HERE, immediately after the install, so a drifted toolchain
      # fails in seconds rather than after ~25 minutes of build work.
      - name: Lint toolchain version pin + self-test (D-18)
        run: |
          ./Tools/scripts/toolchain-policy.sh
          ./Tools/scripts/toolchain-policy.sh --self-test

      # --- Phase 3 (THREAD-06 / D-R1): Rust toolchain + cbindgen ---
      # Phase 3 introduces the first Rust in the repo; cargo/cbindgen are NOT preinstalled on
      # macos-15 (RESEARCH §0 / Pitfall #1). Install + PROVE here so every downstream Rust gate
      # (xcframework build, loom, 1M stress, cbindgen drift, Swift integration) can rely on it; a
      # failed install fails CI loudly rather than silently skipping a gate.
      - name: Cache Rust toolchain + cargo target (Phase 3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup/toolchains
            Packages/CortexRing/rust/target
          key: ${{ runner.os }}-rust-xcode26.3-${{ hashFiles('Packages/CortexRing/rust/Cargo.lock', 'Packages/CortexRing/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-xcode26.3-

      - name: Install Rust toolchain + cbindgen (Phase 3, THREAD-06)
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            brew install rustup-init
            rustup-init -y --no-modify-path --default-toolchain stable
          fi
          # Put cargo/rustc/rustup on PATH for THIS step and export for all later steps.
          source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup default stable
          # Apple targets: macOS device (arm64) + macOS host (x86_64, in case the runner is Intel) +
          # the two iOS targets the xcframework bundles (RESEARCH §3).
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
          # cbindgen 0.29 (matches the [build-dependencies] pin so the drift gate's header is stable).
          command -v cbindgen >/dev/null 2>&1 || cargo install cbindgen
          echo "=== toolchain proof ==="; cargo --version; rustc --version; cbindgen --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-xcode26.3-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-xcode26.3-
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-xcode26.3-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-xcode26.3-

      - name: No-CocoaPods structural check (FOUND-04)
        run: |
          if find . -name Podfile -o -name 'Pods' -type d 2>/dev/null | grep -q .; then
            echo "ERROR: CocoaPods artifacts found. Cortex is SwiftPM-only (FOUND-04)." >&2
            exit 1
          fi
          echo "OK: no CocoaPods artifacts"

      # --- Phase 3 (D-R1): build the CortexRingFFI xcframework BEFORE xcodegen / resolve ---
      # The SwiftPM .binaryTarget points at Packages/CortexRing/CortexRingFFI.xcframework, which is
      # gitignored — so it MUST exist before `swift package resolve`/`xcodegen` parse CortexRing's
      # Package.swift (RESEARCH §3 clean-clone caveat; this step is the CI `make bootstrap`).
      - name: Build CortexRingFFI xcframework (Phase 3, D-R1)
        run: ./Tools/scripts/build-rust.sh

      - name: Generate Xcode project from project.yml
        run: xcodegen

      # FOUND-04 clean-clone proof: every package must resolve its dependencies from a fresh
      # checkout. Resolved PER PACKAGE because there is no Package.swift at the repo root -- the
      # eight packages live under Packages/*/. The original form ran `swift package resolve` from
      # the root and could never have passed: it fails with "Could not find Package.swift in this
      # directory or any of its parent directories" on any machine, including locally. It went
      # unnoticed from Phase 1 to 2026-09-07 because CI had never executed; the repo's first run
      # is what surfaced it.
      - name: Resolve SwiftPM (FOUND-04 clean-clone proof)
        run: |
          set -euo pipefail
          for pkg in Packages/*/; do
            [ -f "${pkg}Package.swift" ] || continue
            echo "--- resolving ${pkg}"
            swift package --package-path "$pkg" resolve
          done
          echo "OK: all SwiftPM packages resolve from a clean clone"

      - name: Per-package SwiftPM build smoke
        run: |
          for pkg in CortexCore CortexIPC CortexRender CortexDecoder CortexReFIT CortexBCIHID CortexDemo; do
            echo "=== build $pkg ==="
            swift build --package-path "Packages/$pkg"
          done

      - name: Run CortexCore unit tests (Swift Testing)
        run: swift test --package-path Packages/CortexCore

      - name: Run CortexIPC tests (Transport + Session + Harness — correctness only, IPC-01..06)
        # Runs RingTests, DoorbellTests, SampleCodecTests, CryptoTests, KeychainTests, and the
        # in-process HarnessE2ETests round trip (decoded==sent + all acked). Per D-18 this gates
        # CORRECTNESS only and checks no performance number — the M4 timing claim is hardware-gated
        # evidence in sc1-evidence.md, never checked on the M1 runner. The two-process spawn test
        # XCTSkips when the daemon binary is unavailable in the runner.
        run: swift test --package-path Packages/CortexIPC

      # --- Phase 3 Rust ring gates (SC#3a/b/c, SC#4) — pre-armed; Wave-2/3 code turns them green ---
      # All correctness/model-checker only and runner-arch-independent (NOT M4-gated). The M4 SC#1
      # Instruments trace is deliberately excluded — it is hardware-gated manual evidence
      # (RESEARCH §5; D-18 precedent). Plan 03-01 OWNS all Phase-3 ci.yml edits; Plans 02/03/04 do
      # not touch this file, they make these pre-armed gates go green (the Phase-1 hotpath-policy.sh
      # / SCM_RIGHTS-grep "trap pre-armed" idiom).

      - name: Rust ring unit + 1M-frame stress (SC#3b/SC#3c)
        # Plan 02 lands the 1,000,000-frame FIFO/no-loss stress test + the align_of==128 cache-line
        # padding assertion. Passes on the Spike-A skeleton (frame static assert + stub ABI) until then.
        run: cargo test --release --manifest-path Packages/CortexRing/rust/Cargo.toml

      - name: Rust ring loom permutation (SC#3a)
        # Model-checker over a tiny ring (Plan 02). Permutes thread interleavings under the C11 model
        # on the runner's own threads — runner-arch-independent, NOT M4-gated (unlike SC#1).
        # Acquire/Release only (loom treats SeqCst as AcqRel — D-R4).
        run: RUSTFLAGS="--cfg loom" cargo test --profile loom --manifest-path Packages/CortexRing/rust/Cargo.toml

      - name: cbindgen header drift (SC#4 defense, D-13)
        # Regenerate the vendored C header via build.rs, then fail if the committed header drifted
        # from the Rust source — the C contract Swift links cannot silently diverge (threat
        # T-03-01-03). Guarded on cbindgen presence, mirroring gen-flatbuffers.sh (D-13).
        run: |
          if command -v cbindgen >/dev/null 2>&1; then
            cargo build --release --manifest-path Packages/CortexRing/rust/Cargo.toml
            git diff --exit-code Packages/CortexRing/rust/include/cortex_ring.h
          else
            echo "cbindgen not present — skipping header drift gate (vendored header is committed)"
          fi

      - name: Swift integration over the Rust C ABI (SC#4)
        # Runs PingSmokeTests now (Spike A); Plan 04 adds the produce→pop integration test. The
        # xcframework was built earlier in the job. Correctness only — NO timing assertion (D-18).
        run: swift test --package-path Packages/CortexRing

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Validate PrivacyInfo manifests (FOUND-03)
        run: |
          ./Tools/scripts/validate-privacy-manifest.sh \
            Apps/CortexMac/PrivacyInfo.xcprivacy \
            Apps/CortexiOS/PrivacyInfo.xcprivacy

      # Phase 7 (Plan 07-02, SC#3): CortexReFIT (ReFIT-Kalman + intent-rotation) joined the hot-path
      # scope via the DIRS_ARRAY default in hotpath-policy.sh -- this default-scope run now polices it
      # too (no separate step needed); the filter runs on the existing decoder pthread, Foundation-free.
      - name: Hot-path policy (D-15, no-op in Phase 1)
        run: ./Tools/scripts/hotpath-policy.sh

      # --- Phase 6 (D-10 tier 1, RENDER-01/04/06/07/08): renderer structural gate + self-test ---
      # The always-on structural PROXY for the load-bearing renderer commitments (value:1 /
      # maximumDrawableCount=2 / framebufferOnly=false / zero-copy / CAMetalDisplayLink on iOS /
      # NSView.displayLink on macOS / compute webgrid / plist 120Hz key / MTL_HUD scheme env). Mirrors
      # the hotpath-policy.sh step above. The live 120Hz + ≤0.4ms GPU NUMBERS are the M5-Pro-ProMotion
      # corroborating tier (Plan 05's dedicated GPU-time bench executable) and the iPad-M4 canonical
      # capture (06-HUMAN-UAT, deferred) — NOT run here (a headless runner cannot prove a refresh rate). The
      # --self-test runs alongside so a silently-weakened gate (a deleted check) fails CI loudly:
      # the corresponding negative-control stops biting -> self-test exits non-zero (threat T-06-04-04).
      - name: Render policy gate (D-10 tier 1, RENDER-01/04/06/07/08)
        run: |
          ./Tools/scripts/render-policy.sh
          ./Tools/scripts/render-policy.sh --self-test

      # --- Phase 8 (SYS-01/05 + SYS-03/04): CortexBCIHID — the ported Apple BCI HID surface tests ---
      # Runs BCIHIDReportTests (exact byte sizes 3/5/4/2/7 + signed-extreme + fixed-point latency
      # round-trip), BCIHIDDescriptorTests (descriptor header + 22-case button enum),
      # DaemonRegistrationTests (SMAppService scaffold via the mockable status path + the
      # VirtualDeviceGate-inert assertion), AND (Plan 08-02) ScanInfoRoundTripTests — the SYS-03/04
      # bidirectional closed-loop round trip (Scan-Info OUTPUT report -> Item-Selection/Pointer intent +
      # the SC#2 instrumented log). This step runs the WHOLE package (NO --filter), so the round-trip
      # tests are gated here, not silently excluded. Correctness only — the live IOHIDUserDevice
      # registration is the Plan 07 HUMAN-UAT gate (the default build links no live HID symbol).
      - name: Run CortexBCIHID tests (SYS-01/05 + SYS-03/04 round trip)
        run: swift test --package-path Packages/CortexBCIHID

      # --- Phase 8 (SYS-01/05/06, D-06): HID surface structural gate + self-test ---
      # The always-on structural PROXY for the load-bearing HID-surface commitments (descriptor
      # Usage-Page 0x05,0x60 / the 5 report-struct names / the virtual.device entitlement in all 3
      # targets / the #if CORTEX_HID_LIVE gate), plus the forbidden checks (no ungated live
      # IOHIDUserDevice symbol; no app-sandbox on Mac/Daemon). Mirrors the render-policy.sh step above.
      # The --self-test runs alongside so a silently-weakened gate (a deleted check) fails CI loudly:
      # the corresponding negative-control stops biting -> self-test exits non-zero (threat T-08-01-04).
      # The live on-device Switch Control registration is NOT run here — it is the Plan 07 HUMAN-UAT gate.
      - name: HID surface policy gate (SYS-01/05/06, D-06)
        run: |
          ./Tools/scripts/hid-surface-policy.sh
          ./Tools/scripts/hid-surface-policy.sh --self-test

      # --- Phase 8 (DIST-01, D-06): notarization-pipeline structural gate + self-test ---
      # The always-on structural PROXY for the DIST-01 notarization pipeline: assert
      # `notarytool submit` + `stapler staple` are present in Tools/scripts/notarize.sh and that the
      # deprecated legacy App Store uploader appears NOWHERE in notarize.sh or the Fastfile (zero
      # occurrences — App Store notarization requires notarytool). Mirrors the render-policy.sh /
      # hid-surface-policy.sh steps above. The --self-test runs alongside so a silently-weakened gate
      # fails CI loudly: the notarytool-strip / stapler-strip / uploader-injection controls stop
      # biting -> self-test exits non-zero (threat T-08-04-04). The LIVE `notarytool submit` is the
      # Plan 07 never-auto-approve HUMAN-UAT gate (paid enrollment + ASC .p8) — NOT run here.
      - name: Notarization pipeline gate (DIST-01, D-06)
        run: |
          ./Tools/scripts/notarize-policy.sh
          ./Tools/scripts/notarize-policy.sh --self-test

      # --- Phase 8 (DIST-02/03, D-06): match/TestFlight pipeline structural gate + self-test ---
      # The always-on structural PROXY for the DIST-02/03 signing config: assert `type("appstore")`
      # + a private `https://` git_url in the Matchfile + the match passphrase read from ENV; FORBID
      # a local-disk git URL, the ssh remote form, and any inline passphrase literal (the P1
      # threat-model grep T-01-04-01 hardened for the appstore swap, T-08-04-02/03). Mirrors the
      # gates above. The --self-test runs alongside so a silently-weakened gate fails CI loudly: the
      # local-disk-URL / appstore->development / broken-https / literal-password / ssh-url controls
      # stop biting -> self-test exits non-zero. The LIVE `fastlane match` is the Plan 07
      # never-auto-approve HUMAN-UAT gate (paid enrollment + private certs repo + MATCH_PASSWORD).
      - name: Match/TestFlight pipeline gate (DIST-02/03, D-06)
        run: |
          ./Tools/scripts/match-policy.sh
          ./Tools/scripts/match-policy.sh --self-test

      # --- Phase 8 (DIST-04/PERF-02, Plan 08-06); REWRITTEN Phase 10 (RD-10, Plan 10-13) ---------
      # README credibility + no-leak gate + self-test. The always-on structural PROXY for the
      # credibility-grade README (the artifact handed to Bliss Chapman / Nir Even-Chen): assert the
      # rejected-alternatives subset (MLX, _ANEClient, CocoaPods, altool), the verbatim
      # `software-timed pipeline latency` methodology phrase (D-07), every honest-gate disclosure
      # (free/Personal-team signing, ANE-eligible, synthetic, entitlement), the Webgrid BPS formula
      # `max(0`/`8.5` gap (PERF-02), and the D-14 real-data provenance triple (`indy_20160630_01`,
      # `9d542cb51d4a`, `open-loop replay`); AND forbid any secret/PII leak (a PEM private-key
      # header, an inline MATCH_PASSWORD, an email, an ASC issuer UUID — T-08-06-02).
      # `photodiode` and the flat `24.7` LEFT the required set with the 2026-08-28 v1 re-point. The
      # figure is now CONTEXT-SENSITIVE (D-13): three rules require the retirement marker on the same
      # line (case-insensitively), forbid any achieved framing anywhere on that line, and require a
      # Future-work/retired governing heading. Do not "restore" the old required tokens.
      # Mirrors the render-policy.sh / notarize-policy.sh / match-policy.sh steps above. The
      # --self-test runs alongside so a silently-weakened gate fails CI loudly: the disclosure-strip
      # (software-timed/synthetic/8.5 + the three provenance literals), the secret-injection
      # (private-key/email/MATCH_PASSWORD/issuer-UUID) and the EIGHT-case D-13 adversarial corpus
      # stop yielding their pinned verdicts -> self-test exits non-zero (threats T-08-06-02/03,
      # T-10-13-01/08). The corpus is the regression test for the 2026-09-05 review finding
      # (10-REVIEWS.md D-1) that an earlier rule design PASSED dishonest sentences and REJECTED
      # honest ones. Over-claiming or leaking a credential into the README would forge the project's
      # credibility, which is exactly what this gate prevents on every PR.
      - name: README credibility + no-leak gate (DIST-04, D-06, RD-10)
        run: |
          ./Tools/scripts/readme-policy.sh
          ./Tools/scripts/readme-policy.sh --self-test

      # --- Phase 10 (RD-09 / RD-10): repo-wide honesty sweep + self-test ---
      # Makes the RD-09 sweep structural instead of a one-time edit. readme-policy.sh above polices
      # ONE file; this polices the tree. Seven assertions: (1) every one of the five enumerated
      # superseded numbers outside the excluded paths carries a labeling token on its own line;
      # (2) every superseded *-evidence.md carries a forward-pointing banner; (3) all eight
      # LAT-01..LAT-08 identifiers survive in ROADMAP.md AND the archived v1 requirement set
      # (milestones/v1.0-REQUIREMENTS.md since the 2026-09-16 archive) so the photodiode
      # RETIREMENT cannot become a DELETION; (4) ADR-0003 exists with the four required headings, a
      # Status line, an index link and both retirement-rationale literals; (5) README.md and
      # docs/cortex-spec.md each state all four BPS non-comparability grounds; (6) every ADR excluded
      # from the token scan carries a DATED supersession note, which is what pays for that exclusion;
      # (7) no line naming the 8.5 Neuralink reference frames it as verified or independently sourced
      # (D-17: it is retrieved and not independently sourceable).
      # It asserts LABELS and STRUCTURE only, never the VALUE of any number (D-09): a red build on a
      # measured finding is pressure to tune that finding. The claim is BOUNDED -- a five-token
      # tripwire against regression, not a proof over every figure in the repo; the universal claim
      # is carried by the RD-09 human review plus decoder-policy.sh / refit-real-policy.sh.
      # The --self-test runs alongside so a silently-weakened gate is caught, exactly as the other
      # policy gates do. Two of its 14 controls exist specifically to prove that neither the path
      # exclusions nor the digit-string collision exemptions are blanket holes: the same unlabeled
      # string bites the moment it moves into scanned position. The gate's own header names every
      # excluded path and every collision form, each with its reason -- read it before widening one.
      - name: Repo-wide honesty sweep + self-test (RD-09/RD-10)
        run: |
          ./Tools/scripts/honesty-sweep.sh
          ./Tools/scripts/honesty-sweep.sh --self-test

      # --- Info.plist keys XcodeGen would silently strip (Phase 10 follow-up, 2026-09-07) ---
      # XcodeGen REGENERATES Info.plist from project.yml's info.properties rather than merging into
      # it, so a key present only in the tracked plist is dropped from the built app on the next
      # `xcodegen generate`. NSAccessibilityUsageDescription and CortexBCIHIDProtocolVersion were in
      # that state from 2cdb878 (2026-06-23) until 2026-09-07: written to the generator's output,
      # never to its input, stripped on every generate, and green the whole time because no gate
      # asserted them. This gate asserts BOTH sides -- the tracked plist and the project.yml block --
      # and controls 3 and 4 of its self-test are the real defect's exact shape, key gone from
      # project.yml with the plist still intact.
      - name: Info.plist required keys + self-test (SYS-01/05)
        run: |
          ./Tools/scripts/infoplist-policy.sh
          ./Tools/scripts/infoplist-policy.sh --self-test

      # --- Phase 6 (RENDER-03, SC#3): build-time assertion that 120Hz is unlocked in the iOS plist ---
      # Mirrors the Phase-1 validate-privacy-manifest.sh / Verify-PrivacyInfo-in-bundle build-time
      # discipline (RESEARCH Decision 7). Two layers, both deterministic and build-free on the runner:
      #   (1) grep the SOURCE project.yml for the key==true (XcodeGen's single source of truth);
      #   (2) plutil -extract on Apps/CortexiOS/Info.plist (XcodeGen merged the key into it at the
      #       "Generate Xcode project" step above), the Phase-1 plutil idiom — proves the key landed
      #       in the actual built plist as a real boolean <true/>, not just in the spec.
      # Either layer absent/false fails the build (T-06-04-03). The live 120Hz refresh-rate proof is
      # the Mac-corroborating tier (Plan 05), never asserted on a headless CI runner.
      - name: Verify iOS 120Hz plist key (RENDER-03, SC#3)
        run: |
          set -euo pipefail
          if ! grep -qE 'CADisableMinimumFrameDurationOnPhone:[[:space:]]*true' project.yml; then
            echo "ERROR: project.yml is missing CADisableMinimumFrameDurationOnPhone: true — 120Hz on ProMotion stays capped at the default (RENDER-03/SC#3)." >&2
            exit 1
          fi
          VAL=$(plutil -extract CADisableMinimumFrameDurationOnPhone raw Apps/CortexiOS/Info.plist 2>/dev/null || echo "<absent>")
          if [[ "$VAL" != "true" ]]; then
            echo "ERROR: Apps/CortexiOS/Info.plist CADisableMinimumFrameDurationOnPhone is '$VAL', expected 'true' (RENDER-03/SC#3)." >&2
            exit 1
          fi
          echo "OK: CADisableMinimumFrameDurationOnPhone=true in project.yml AND the built iOS Info.plist (120Hz unlocked, RENDER-03)"

      - name: No SCM_RIGHTS / cmsg structural check (SC#2 — FD passing MUST be mach_msg, not socket control messages)
        # IPC-03/SC#2 mandate the shm fd is handed off via mach_msg + MACH_MSG_PORT_DESCRIPTOR
        # (fileport), NEVER via BSD-socket control-message FD passing. This grep scans BOTH the
        # IPC source tree AND the shared C shim tree and fails the build if a socket FD-passing
        # path is ever reintroduced (defense-in-depth with the per-plan greps in Plans 02-02/02-04).
        run: |
          if grep -rnE 'SCM_RIGHTS|cmsg\(' \
               Packages/CortexIPC/Sources \
               Packages/CortexCore/Sources/CortexCoreC 2>/dev/null; then
            echo "ERROR: SCM_RIGHTS/cmsg found — IPC-03/SC#2 mandate mach_msg + MACH_MSG_PORT_DESCRIPTOR, no socket FD passing." >&2
            exit 1
          fi
          echo "OK: no SCM_RIGHTS / cmsg — FD passing is mach_msg-only (SC#2)"

      # --- Phase 5 (DEC-12): no _ANEClient private API anywhere in production source ---
      # The Apple-private _ANEClient symbol is a guaranteed App Store rejection (PROJECT Out of
      # Scope); Cortex pins the ANE solely via the public MLModelConfiguration.computeUnits +
      # MLComputePlan. This tree-wide negative control fails the build if the private symbol is
      # ever introduced into production source — extending the Phase-1/2/4 grep-gate discipline
      # (SCM_RIGHTS above; the Decoder forbidden-token regex). The token is assembled from
      # fragments so THIS step's own line is not a self-hit, and the Tests/tests dirs are excluded
      # because the DEC-12 negative-control tests (VelocityOutputTests.swift, test_*_package.py)
      # legitimately NAME the symbol in order to forbid it.
      #
      # The gate scripts are excluded for exactly the same reason, added 2026-09-07. readme-policy.sh
      # REQUIRES the README to name _ANEClient as a rejected alternative (DIST-04), so it carries the
      # token in three places. That made this control fail from Phase 8's 9b3013c onward -- it was
      # satisfiable when Phase 5 wrote it, when the only hits were under Tests/. Two phases shipped
      # over a broken negative control because CI had never executed. The exclusion is narrow on
      # purpose: bash gate scripts cannot call an ANE API, while Tools/ still holds real Swift source
      # (the spikes) that IS scanned.
      # .build is excluded because compiled test binaries embed the string from the very
      # negative-control tests that are already excluded as source. On the runner this happened to be
      # invisible at step 37, since no package had been tested yet and no .build existed; that is
      # step ordering, not a property worth relying on.
      - name: No _ANEClient private API (DEC-12 negative control)
        run: |
          FORBIDDEN="_ANE""Client"
          if grep -rn --exclude-dir=Tests --exclude-dir=tests --exclude-dir=.build \
               --exclude='*-policy.sh' --exclude='*-sweep.sh' "$FORBIDDEN" \
               Packages Apps Decoder Tools 2>/dev/null; then
            echo "ERROR: $FORBIDDEN found in production source — DEC-12 forbids the Apple-private ANE API (App Store rejection). Use MLModelConfiguration.computeUnits + MLComputePlan." >&2
            exit 1
          fi
          echo "OK: no $FORBIDDEN in production source — ANE access is public-API-only (DEC-12)"

      # --- Phase 5 (DEC-07/DEC-09/DEC-10 Swift-side + DEC-12 mirror): CortexDecoder suite ---
      # Runs ComputeUnitsTests (config == .cpuAndNeuralEngine, build-gate != .all), ZeroCopyInputTests
      # (MLMultiArray(pixelBuffer:) pointer identity over the shared IOSurface — no host copy), and
      # VelocityOutputTests (the (vx,vy) model-backed decode skips cleanly when the gitignored
      # .mlpackage is absent + the DEC-12 Swift-side scan). CORRECTNESS ONLY — NO timing/latency
      # assertion (the <2ms p99 claim is Plan 04 in-process + iPad-M4 canonical, D-18 precedent).
      - name: Run CortexDecoder tests (DEC-07/09/10 Swift-side, correctness only)
        run: swift test --package-path Packages/CortexDecoder

      # --- Phase 7 (REFIT-01/02/03): CortexReFIT full suite (constants + filter + Fitts math) ---
      # KalmanConstantsTests guards the GENERATED KalmanConstants.swift code-gen invariants (K's
      # position rows 0,1 are zero — the observability resolution; H = [0 I 0]; A carries the
      # constant-acceleration dt / ½dt² coupling — threat T-07-01-02). Plan 02 added the filter +
      # intent-rotation suites (KalmanFilterTests, IntentRotationTests). Plan 03 added the S&M-2004
      # throughput + dwell-to-select suite (FittsThroughputTests: IDe=log2(De/We+1), We=4.133·SDx,
      # TP=IDe/MT, mean-of-means-vs-pooled, HIT/TIMEOUT). All correctness, runner-arch-independent.
      - name: Run CortexReFIT tests (REFIT-01/02/03 — constants + filter + S&M-2004 throughput)
        run: swift test --package-path Packages/CortexReFIT

      # --- Phase 6 (RENDER-01/02/03): CortexRender's own test suite ---
      # CortexRender was BUILT by the matrix loop above but its tests were never RUN: before
      # 2026-09-07 this workflow had seven `swift test` invocations and none of them was
      # CortexRender, so 19 tests covering the cursor integrator, the SPSC velocity ring and the
      # webgrid parameters had never executed on a runner. Found while auditing which packages CI
      # actually tests, after the macos-15 runtime failure showed that "CI is green" and "CI ran the
      # thing" are different claims. Correctness only; no GPU timing is asserted here, since the
      # runner's GPU is not the M5 Pro the render evidence was measured on.
      - name: Run CortexRender tests (RENDER-01/02/03 — integrator, velocity ring, webgrid params)
        run: swift test --package-path Packages/CortexRender

      # --- Phase 7 (REFIT-03 / D-10, SC#2): deterministic ReFIT BPS-uplift guard ---
      # The build-failing structural invariant on the committed refit_bps.json: refit_bps >= raw_bps
      # on the fixed seed (mirrors the Phase-4 co-bps>null gate). A filter regression that erases the
      # intent-rotation uplift fails CI (threat T-07-03-04). The number is S&M-2004 Fitts THROUGHPUT
      # (TP=IDe/MT, effective-width) — NOT the Webgrid bitrate; this guards the raw->ReFIT ORDERING on
      # the identical seed-locked replay, not any 4.16/8.5 comparison (Phase 8, deferred per D-13). The
      # runner has python3 (no extra tooling). Two layers: (1) re-run the seed-locked harness --smoke
      # and assert it reproduces the committed JSON byte-for-byte (determinism — threat T-07-03-01/02);
      # (2) the python guard asserts refit_bps >= raw_bps and fails the build otherwise.
      - name: ReFIT BPS uplift + determinism guard (REFIT-03, D-10)
        run: |
          set -euo pipefail
          COMMITTED=.planning/phases/07-refit-kalman-closed-loop-recalibration/refit_bps.json
          # (1) Determinism: regenerate from the seed-locked harness and assert byte-identity.
          swift run --package-path Packages/CortexReFIT CortexReFITBench --smoke >/dev/null
          GENERATED=Packages/CortexReFIT/.bench/refit_bps.json
          if ! diff -q "$GENERATED" "$COMMITTED" >/dev/null; then
            echo "ERROR: CortexReFITBench --smoke no longer reproduces the committed refit_bps.json byte-for-byte." >&2
            echo "       The harness output drifted from the committed evidence (threat T-07-03-02). Diff:" >&2
            diff "$GENERATED" "$COMMITTED" >&2 || true
            exit 1
          fi
          echo "OK: CortexReFITBench --smoke reproduces the committed refit_bps.json byte-for-byte (deterministic)."
          # (2) Uplift invariant: refit_bps >= raw_bps (fails the build otherwise).
          python3 Tools/scripts/check_refit_uplift.py "$COMMITTED"

      # --- Phase 8 (PERF-01, D-06/D-13): Webgrid BPS structural + determinism gate + self-test ---
      # ADDITIVE to the intact Phase-7 ReFIT guard above (this guards the SEPARATE webgrid_bps.json).
      # bps-policy.sh asserts (1) the MANDATORY Swift.max(0,…) clamp + log2 in WebgridBPS.swift
      # (08-RESEARCH §0.4 — CONTEXT D-11 omitted the clamp; a net-negative Sc<Si must never report a
      # negative bitrate), (2) the committed webgrid_bps.json carries the formula disclosure pin
      # `B = max(0, log2(N)*(Sc-Si)/t)` + n_targets 900, and (3) the harness is DETERMINISTIC — it
      # re-runs CortexReFITBench --smoke TWICE and diffs webgrid_bps.json byte-for-byte (D-13), and
      # asserts the committed copy == the regenerated output (regenerate-from-code provenance, threat
      # T-08-05-03). The --self-test runs alongside so a silently-weakened gate fails CI loudly: the
      # clamp-strip + formula-strip negative controls must bite (threat T-08-05-01). The CortexReFIT
      # test step above runs the package suite with NO --filter, so WebgridBPSTests (the REAL formula
      # correctness guard, incl. the clamp-bites Test 2) is included. The Webgrid BPS is the
      # leaderboard-comparable metric (PERF-01); the S&M-2004 Fitts-TP (Phase-7 guard above) is the
      # cross-check (PERF-03). Number reported HONESTLY on synthetic replay, NOT tuned toward 4.16 (D-12).
      - name: Webgrid BPS structural + determinism gate (PERF-01, D-06/D-13)
        run: |
          ./Tools/scripts/bps-policy.sh
          ./Tools/scripts/bps-policy.sh --self-test

      # --- Phase 8 (SYS-06/PERF-04, Plan 08-03): CortexDemo closed-loop + glass-to-glass timer tests ---
      # Runs the WHOLE CortexDemo package (NO --filter) so BOTH suites are gated here, not silently
      # excluded: ReplayPipelineTests (SYS-06/D-10 — the synthetic-spike → NDT1 → ReFIT → webgrid loop
      # reaches a HIT with the decoder + Kalman GENUINELY in the loop, deterministic, NDT1 model-skip-
      # clean) AND GlassToGlassTimerTests (PERF-04/D-07 — the software-timed sample uses
      # targetPresentationTimestamp + embeds the verbatim methodology label). Correctness only — the
      # canonical iPad-M4 latency capture is the Plan 07 HUMAN-UAT gate (D-08); the model-backed NDT1 path
      # skips cleanly when CORTEX_MODEL_URL is unset (the gitignored .mlpackage is absent on CI).
      - name: Run CortexDemo tests (SYS-06/PERF-04)
        run: swift test --package-path Packages/CortexDemo

      # --- Phase 10 (RD-08): Seam B chain smoke over the COMMITTED SYNTHETIC FIXTURE ---
      # Runs the whole D-05 chain -- seal, shm ring, doorbell, decrypt, ordering, 32-bin accumulation,
      # SpikeInputBuffer fill, cursor integration, HID pointer-report encode -- on the 256-bin synthetic
      # fixture, because the D-07 tier split keeps the real dataset off the runner. This is NOT a
      # real-data result and the binary labels it `data_source: synthetic_fixture`. The CoreML decode is
      # skipped when no model is present; every other leg executes. The smoke fails if it resolves a
      # source and completes zero windows, so it cannot pass vacuously.
      - name: Seam B chain smoke on the synthetic fixture (RD-08)
        run: swift run --package-path Packages/CortexDemo CortexSeamBSmoke

      # --- Phase 8 (PERF-04, Plan 08-03): software-timed glass-to-glass bench SMOKE (M5 corroborating) ---
      # Proves the bench RUNS + the PERF-04 assertion path is live (p99 < 25ms on the CI runner's
      # software-timed pipeline) + the verbatim methodology label is printed. This is correctness/smoke
      # ONLY: the canonical sub-25ms claim is the M5-Pro corroborating bench (Plan 08-03 --full) + the
      # iPad-M4 HUMAN-UAT capture (D-08) against a real CAMetalDisplayLink present timestamp — NOT the
      # headless runner. The bench exits non-zero if p99 >= 25ms, so a software-pipeline regression fails CI.
      - name: Software-timed glass-to-glass bench smoke (PERF-04, M5 corroborating)
        run: swift run --package-path Packages/CortexDemo CortexDemoBench --smoke

      - name: Build CortexMac scheme (unsigned smoke)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cortex.xcodeproj \
            -scheme CortexMac \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions

      - name: Build CortexiOS scheme (unsigned smoke, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cortex.xcodeproj \
            -scheme CortexiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions

      - name: Build CortexDaemon scheme (verify SPM library reachability per Critical Finding #4)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cortex.xcodeproj \
            -scheme CortexDaemon \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions

      - name: Verify PrivacyInfo.xcprivacy is included in built .app bundles (Pitfall #7 mitigation)
        run: |
          MAC_PRIVACY=$(find ~/Library/Developer/Xcode/DerivedData -name PrivacyInfo.xcprivacy -path '*CortexMac.app*' 2>/dev/null | head -1)
          IOS_PRIVACY=$(find ~/Library/Developer/Xcode/DerivedData -name PrivacyInfo.xcprivacy -path '*CortexiOS.app*' 2>/dev/null | head -1)
          test -f "$MAC_PRIVACY" || { echo "ERROR: CortexMac.app missing PrivacyInfo.xcprivacy in bundle" >&2; exit 1; }
          test -f "$IOS_PRIVACY" || { echo "ERROR: CortexiOS.app missing PrivacyInfo.xcprivacy in bundle" >&2; exit 1; }
          echo "OK: both .app bundles contain PrivacyInfo.xcprivacy"
          echo "  CortexMac: $MAC_PRIVACY"
          echo "  CortexiOS: $IOS_PRIVACY"

      - name: Verify no app-sandbox in Mac entitlements (Critical Finding #1)
        run: |
          if grep -l 'com.apple.security.app-sandbox' Apps/CortexMac/Cortex.entitlements Apps/CortexDaemon/Cortex.entitlements 2>/dev/null; then
            echo "ERROR: app-sandbox declared on Mac target -- Phase 1 keeps sandbox OFF (Critical Finding #1)" >&2
            exit 1
          fi
          echo "OK: Mac targets remain unsandboxed in Phase 1"

      - name: Verify CortexDaemon bundle artifact exists
        run: |
          DAEMON=$(find ~/Library/Developer/Xcode/DerivedData -name 'CortexDaemon.bundle' -type d 2>/dev/null | head -1)
          # Accept either bundle or executable fallback per Plan 02 Task 3
          if [[ -z "$DAEMON" ]]; then
            DAEMON=$(find ~/Library/Developer/Xcode/DerivedData -name 'CortexDaemon' -type f -perm -u+x 2>/dev/null | head -1)
          fi
          test -n "$DAEMON" || { echo "ERROR: CortexDaemon artifact not produced" >&2; exit 1; }
          echo "OK: CortexDaemon artifact at $DAEMON"

      # --- Phase 8 (DIST-02/03, Plan 08-04): BLOCKING ruby -c parse of the real fastlane lanes ---
      # The Fastfile/Matchfile/Appfile are REAL appstore lanes now (no longer Phase-1 placeholders),
      # so a parse failure is a real regression -> this is a BLOCKING check (ruby -c is pure syntax,
      # no gem load, runs on the runner's stock Ruby). The actual lane EXECUTION (bundle exec fastlane
      # beta / match / notarytool / upload_to_testflight) is the Plan 07 never-auto-approve HUMAN-UAT
      # gate and is deliberately NOT run in CI — CI must never contact Apple (no enrollment, no .p8;
      # threat T-08-04-05). The structural gates above (notarize-policy / match-policy) are the
      # always-on content checks; this step guards parseability.
      - name: Fastlane lanes parse (ruby -c, blocking; DIST-02/03)
        run: |
          set -euo pipefail
          ruby -c fastlane/Fastfile
          ruby -c fastlane/Matchfile
          ruby -c fastlane/Appfile
          echo "OK: Fastfile + Matchfile + Appfile parse cleanly (real appstore lanes)."

      # Bundler resolution is a non-blocking readiness smoke ONLY (Plan 01-04 scaffold). It does NOT
      # run any lane and never contacts Apple — the live submission is the Plan 07 HUMAN-UAT gate.
      - name: Bundler smoke (fastlane gem resolution readiness; non-blocking, no live lane)
        continue-on-error: true
        run: |
          set +e
          if [[ -f Gemfile ]]; then
            bundle config set --local path 'vendor/bundle' >/dev/null
            bundle install --quiet
            BUNDLE_EXIT=$?
            if [[ $BUNDLE_EXIT -ne 0 ]]; then
              echo "WARN: bundle install failed (non-blocking -- Plan 04 fastlane scaffold soft-failure)" >&2
            else
              echo "OK: bundle install succeeded (gem resolution only; NO lane executed)"
            fi
          fi
          set -e

  # --- Phase 9 (D-18 / RD-06c): the Decoder Python subsystem's first blocking CI gate ---
  # Closes a real hole: before this, 3,582 lines of Python had zero CI coverage (ci.yml contained
  # no uv, no pytest, no ndt1). Runs the QUICK suite only (-m "not slow"): per the tier split
  # (D-21 / Phase 2 D-18 / Phase 6 D-10) CI gates correctness and structure and NEVER trains,
  # NEVER downloads the 1.77 GB dataset, and NEVER asserts a measured number. Every test here
  # passes on a checkout with an empty Decoder/data/ and no checkpoints (both are gitignored).
  #
  # A sibling job rather than a step inside build-and-lint: that job is already near its 30-minute
  # timeout with the Rust toolchain, SwiftPM, DerivedData and seven policy gates, and the Python
  # suite shares none of it, so a separate job fails fast on Python regressions and runs in
  # parallel.
  #
  # The dev extra is REQUIRED -- a bare `uv run pytest` fails with a misleading
  # "No module named numpy" (see AGENTS.md). setup-uv handles its own cache save/restore; do NOT
  # wrap it in an actions/cache step the way SwiftPM/DerivedData are wrapped (09-RESEARCH 11).
  decoder-python:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 09-09-PLAN and 09-RESEARCH 11 both specify astral-sh/setup-uv@v8, but that ref does not
      # exist: this publisher ships no floating major tags (refs/tags/v8, v9 and v10 all 404), so
      # @v8 would fail to resolve. Per the plan's own fallback rule this pins the latest tag that
      # does resolve, v10.0.1. Both inputs whose defaults changed since v8 are set explicitly here,
      # so the v9/v10 breaking changes (enable-cache:auto now disables the cache for
      # pull_request_target/workflow_run/release; prune-cache now defaults to false) do not apply.
      - name: Set up uv (Decoder Python subsystem)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            Decoder/uv.lock
            Decoder/pyproject.toml
          cache-suffix: decoder-py312
          prune-cache: true

      - name: Sync Decoder env (the dev extra is REQUIRED -- see AGENTS.md)
        run: uv sync --project Decoder --extra dev

      - name: Print Decoder toolchain versions
        run: |
          uv run --project Decoder python -VV
          uv run --project Decoder python -c "import numpy, h5py, torch, coremltools; print('numpy', numpy.__version__); print('h5py', h5py.__version__); print('torch', torch.__version__); print('coremltools', coremltools.__version__)"

      - name: Ruff (no bare/blind except -- the BLE gate)
        run: uv run --project Decoder ruff check Decoder

      - name: Decoder quick suite (no dataset, no training, no measured-number assertions)
        run: uv run --project Decoder pytest Decoder/tests -m "not slow" -q

      # Runs AFTER the suite on purpose: it proves the suite that just passed had no dataset to
      # read and no export artifacts were produced (D-21 tier split). Decoder/data/ and
      # Decoder/exports/ are gitignored; a non-empty directory means real-data processing leaked
      # into the CI tier. Scripts that MUST NEVER run in CI: export_replay.py, webgrid_ceiling.py.
      - name: Prove the quick suite needs no dataset or export artifacts
        run: |
          set -euo pipefail
          test ! -e Decoder/data || test -z "$(ls -A Decoder/data 2>/dev/null)" \
            || { echo "ERROR: Decoder/data is non-empty on a CI checkout -- the dataset must stay gitignored" >&2; exit 1; }
          test ! -e Decoder/exports || test -z "$(ls -A Decoder/exports 2>/dev/null)" \
            || { echo "ERROR: Decoder/exports is non-empty on a CI checkout -- export artifacts must stay gitignored" >&2; exit 1; }
          echo "OK: the quick suite ran with empty Decoder/data/ and Decoder/exports/."

      # D-19: ties every published decoder number back to the manifest bytes it came from. The
      # --self-test runs alongside the gate, exactly as the seven build-and-lint policy gates do,
      # so a silently weakened gate fails CI loudly (threat T-09-09-02).
      - name: Decoder provenance policy gate + self-test (D-19)
        run: |
          ./Tools/scripts/decoder-policy.sh
          ./Tools/scripts/decoder-policy.sh --self-test

      # D-09 / D-21: checks that the Phase-10 real-data result artifacts declare provenance
      # (data_source=="real", 64-hex source_sha256, session_id matches the manifest) and that
      # cross-artifact invariants hold (same session and sha across refit-real, replay, ceiling).
      # Asserts STRUCTURE only -- never the sign or magnitude of a measured result.
      # The --self-test proves the gate bites on a mutated clean quartet.
      - name: Real-data provenance gate + self-test (D-09/D-21)
        run: |
          ./Tools/scripts/refit-real-policy.sh
          ./Tools/scripts/refit-real-policy.sh --self-test
