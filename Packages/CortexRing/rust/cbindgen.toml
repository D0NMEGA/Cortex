# cbindgen config for the cortex_ring C ABI header (THREAD-06, RESEARCH §1).
# build.rs runs cbindgen::generate(CARGO_MANIFEST_DIR) which reads this file and writes
# include/cortex_ring.h. The header is VENDORED in-repo and CI drift-gated (D-13 pattern) so the
# C contract Swift links cannot silently diverge from the Rust source (threat T-03-01-03).

# Emit C, not C++. cbindgen's default language is "C++"; without this the Swift modulemap would
# import a C++ header (RESEARCH §1).
language = "C"

# extern "C" guards so a C++ translation unit could also include the header cleanly.
cpp_compat = true

# Include guard + pragma once (belt-and-suspenders against double inclusion).
include_guard = "CORTEX_RING_H"
pragma_once = true

# Auto-generation banner so the committed header is obviously machine-generated (do not hand-edit;
# the drift gate regenerates and `git diff --exit-code`s it).
autogen_warning = "/* AUTO-GENERATED by cbindgen from Packages/CortexRing/rust. DO NOT EDIT. Regenerate via `cargo build` (build.rs) or Tools/scripts/build-rust.sh; CI drift-gates this file. */"

# typedef struct Foo { ... } Foo; declaration style.
style = "both"

[export]
# Export the opaque ring handle and the frame even though they only appear behind pointers /
# are not transitively reachable from a function return by value — cbindgen otherwise prunes
# types it thinks are unused.
include = ["CortexFrame", "CortexSpsc"]
