# SwiftLint configuration per RESEARCH.md Q9.
# Disabled rules avoid overlap with SwiftFormat (line_length, todo).
# Opt-in rules cover the high-leverage checks for production-grade Swift.

disabled_rules:
  - line_length              # Already covered by SwiftFormat --maxwidth 120
  - todo                     # Phase 1 has many TODOs; gate at v0/v1 instead.
  - trailing_comma           # Conflicts with SwiftFormat --commas inline

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_imports
  - unused_import
  - unused_declaration
  - convenience_type
  - empty_collection_literal
  - empty_string
  - last_where
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool

included:
  - Apps
  - Packages

excluded:
  - .build
  # Glob, not an enumeration. The per-package list this replaces named only the four packages that
  # existed when it was written, so CortexReFIT/CortexRing/CortexDemo/CortexBCIHID were linted
  # INSIDE their .build directories once a `swift test` had created them -- i.e. SwiftLint was
  # reporting violations in vendored dependency checkouts and generated sources. Proven in
  # 10-lint-baseline.md. A glob cannot go stale as packages are added (Phase 10 / D-18).
  - Packages/*/.build
  - DerivedData
  - Cortex.xcodeproj
  - Cortex.xcworkspace
  - vendor
  - fastlane
  # Machine-written FlatBuffers output (`flatc`). Its header is literally "automatically generated by
  # the FlatBuffers compiler, do not modify", and it already carries `swiftlint:disable all` +
  # `swiftformat:disable all` on lines 2-3. That bare `disable all` is itself the repo's single
  # `blanket_disable_command` violation, and it cannot be narrowed at the source: the file is
  # regenerated from the .fbs schema, so any hand edit is erased on the next `flatc` run. Excluding
  # the directory is the fix that survives regeneration; nothing is lost, since the file opted out of
  # every rule already. Drove: Packages/CortexIPC/Sources/CortexIPCSession/generated/
  # sample_generated.swift (Phase 10 / D-18).
  - Packages/*/Sources/*/generated

analyzer_rules:
  - unused_declaration
  - unused_import

force_unwrapping:
  severity: error            # Force unwrap is BANNED -- try! and as! allowed in tests only.

# SwiftFormat's `wrapMultilineStatementBraces` (on by default, and this repo sets no brace option)
# moves the opening brace to its OWN line when a function signature or an `if`/`guard` condition is
# wrapped across several lines. SwiftLint's `opening_brace` wants that same brace on the declaration
# line. The two are mutually unsatisfiable at all 11 sites: hand-editing a site into SwiftLint's form
# and re-running `swiftformat` put the brace straight back on its own line (measured 2026-09-07 on
# Apps/CortexDaemon/Producer.swift:75). SwiftLint ships these two flags for exactly this coexistence,
# so the linter yields on the wrapped case ONLY. Everything else the rule polices still fails:
# `func abc(){`, `if x{`, and a stray brace line after a single-line declaration are all still caught.
# Drove (8 signatures): Apps/CortexDaemon/Benchmark.swift:191, Apps/CortexDaemon/Producer.swift:76,
# CortexDemo/ClosedLoopPipeline.swift:351 and :448, CortexIPC/FDChannel.swift:35,
# CortexIPC/Rendezvous.swift:69, CortexIPC/HarnessConsumer.swift:96 and :155.
# Drove (3 conditions): CortexDecoderBench/main.swift:51, CortexIPC/FDChannel.swift:75,
# CortexIPC/HarnessConsumer.swift:104. (Phase 10 / D-18)
opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true

type_name:
  # `iOS` is Apple's own spelling of the platform, and this type is the iOS half of a
  # MacDisplayLinkAdapter/iOSDisplayLinkAdapter pair guarded by `#if os(iOS)`. SwiftLint wants
  # `IOSDisplayLinkAdapter`, which misspells the platform to satisfy a capitalisation rule. Named
  # exception rather than a rule-wide relaxation: any OTHER lowercase-initial type still fails.
  excluded:
    - iOSDisplayLinkAdapter
