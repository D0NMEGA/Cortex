# SwiftLint configuration per RESEARCH.md Q9.
# Disabled rules avoid overlap with SwiftFormat (line_length, todo).
# Opt-in rules cover the high-leverage checks for production-grade Swift.

disabled_rules:
  - line_length              # Already covered by SwiftFormat --maxwidth 120
  - todo                     # Phase 1 has many TODOs; gate at v0/v1 instead.
  - trailing_comma           # Conflicts with SwiftFormat --commas inline

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_imports
  - unused_import
  - unused_declaration
  - convenience_type
  - empty_collection_literal
  - empty_string
  - last_where
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool

included:
  - Apps
  - Packages

excluded:
  - .build
  # Glob, not an enumeration. The per-package list this replaces named only the four packages that
  # existed when it was written, so CortexReFIT/CortexRing/CortexDemo/CortexBCIHID were linted
  # INSIDE their .build directories once a `swift test` had created them -- i.e. SwiftLint was
  # reporting violations in vendored dependency checkouts and generated sources. Proven in
  # 10-lint-baseline.md. A glob cannot go stale as packages are added (Phase 10 / D-18).
  - Packages/*/.build
  - DerivedData
  - Cortex.xcodeproj
  - Cortex.xcworkspace
  - vendor
  - fastlane
  # Machine-written FlatBuffers output (`flatc`). Its header is literally "automatically generated by
  # the FlatBuffers compiler, do not modify", and it already carries `swiftlint:disable all` +
  # `swiftformat:disable all` on lines 2-3. That bare `disable all` is itself the repo's single
  # `blanket_disable_command` violation, and it cannot be narrowed at the source: the file is
  # regenerated from the .fbs schema, so any hand edit is erased on the next `flatc` run. Excluding
  # the directory is the fix that survives regeneration; nothing is lost, since the file opted out of
  # every rule already. Drove: Packages/CortexIPC/Sources/CortexIPCSession/generated/
  # sample_generated.swift (Phase 10 / D-18).
  - Packages/*/Sources/*/generated

analyzer_rules:
  - unused_declaration
  - unused_import

force_unwrapping:
  severity: error            # Force unwrap is BANNED -- try! and as! allowed in tests only.

# SwiftFormat's `wrapMultilineStatementBraces` (on by default, and this repo sets no brace option)
# moves the opening brace to its OWN line when a function signature or an `if`/`guard` condition is
# wrapped across several lines. SwiftLint's `opening_brace` wants that same brace on the declaration
# line. The two are mutually unsatisfiable at all 11 sites: hand-editing a site into SwiftLint's form
# and re-running `swiftformat` put the brace straight back on its own line (measured 2026-09-07 on
# Apps/CortexDaemon/Producer.swift:75). SwiftLint ships these two flags for exactly this coexistence,
# so the linter yields on the wrapped case ONLY. Everything else the rule polices still fails:
# `func abc(){`, `if x{`, and a stray brace line after a single-line declaration are all still caught.
# Drove (8 signatures): Apps/CortexDaemon/Benchmark.swift:191, Apps/CortexDaemon/Producer.swift:76,
# CortexDemo/ClosedLoopPipeline.swift:351 and :448, CortexIPC/FDChannel.swift:35,
# CortexIPC/Rendezvous.swift:69, CortexIPC/HarnessConsumer.swift:96 and :155.
# Drove (3 conditions): CortexDecoderBench/main.swift:51, CortexIPC/FDChannel.swift:75,
# CortexIPC/HarnessConsumer.swift:104. (Phase 10 / D-18)
opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true

type_name:
  # `iOS` is Apple's own spelling of the platform, and this type is the iOS half of a
  # MacDisplayLinkAdapter/iOSDisplayLinkAdapter pair guarded by `#if os(iOS)`. SwiftLint wants
  # `IOSDisplayLinkAdapter`, which misspells the platform to satisfy a capitalisation rule. Named
  # exception rather than a rule-wide relaxation: any OTHER lowercase-initial type still fails.
  excluded:
    - iOSDisplayLinkAdapter

identifier_name:
  # ONLY the min-length arm is relaxed. The character-set arm and `validates_start_with_lowercase`
  # are deliberately LEFT AT THEIR DEFAULTS, because the character-set arm is the one that polices
  # the snake_case JSON wire keys, and Plan 10-16 cleared all 97 of those the expensive way --
  # camelCase Swift properties plus explicit `CodingKeys` -- precisely so this rule could stay armed
  # against them. Do NOT add this rule's symbol-allowlist option (the setting that would let `_`
  # through): threat T-10-16-03 names doing so as the way to clear the class without earning it, and
  # an acceptance gate greps this file for that option's name, so writing it here even inside a
  # comment turns a real signal into a false alarm. That is why it is described and not spelled.
  #
  # Why the min-length arm is off. SwiftLint's default (warning 3 / error 2) reported 328 violations
  # -- 189 at error severity for 1-character names and 139 at warning for 2-character ones -- and the
  # population is mathematical and systems NOTATION, not lazy naming:
  #   Kalman / linear algebra   x z a h k p q r s A H K a0..a5 h0 h1 k0..k5 hx  (the ReFIT filter)
  #   kinematics                dt dx dy vx vy x0 t0 t1
  #   POSIX and Mach            fd rc cb kq kh ns ts
  #   loop indices              i j k n m
  # `KalmanFilter.swift`'s own file header writes the per-tick ordering as
  #     x- = A . x                  (predict)
  #     x  = x- + K . (z_rot - H . x-)   (update, constant gain)
  # so renaming `x`, `z`, `K`, `H` to 3-plus-character names would break the correspondence between
  # the code, that comment, and the ReFIT literature the constants were solved against. The rename
  # would also be a ~328-site diff across ~50 files, reaching into the hot path (`ShmRing.swift`,
  # `Doorbell.swift`) and into the three bench mains whose JSON output is byte-diffed by CI -- the
  # unreviewable-diff failure mode this plan's own threat register calls out (T-10-16-06).
  #
  # Unlike the snake_case class, there is no option here that keeps both properties: `CodingKeys` let
  # the wire format and the Swift names BOTH be right, whereas renaming `x` to `stateVector` simply
  # trades one property for another. What this DOES give up, stated plainly: SwiftLint will no longer
  # flag a genuinely lazy short name (`fa`, `o1`, `s2` and similar already exist in the test files).
  # Length was never a good proxy for clarity in this codebase, and code review is the check for that.
  #
  # Drove (top files): CortexReFITTests/KalmanFilterTests.swift 45, CortexReFIT/KalmanFilter.swift 23,
  # CortexDaemon/Benchmark.swift 22, CortexRenderTests/VelocityRingTests.swift 21,
  # CortexRender/CursorIntegrator.swift 11, CortexIPC/ShmRing.swift 11, CortexIPC/Doorbell.swift 11,
  # CortexRenderBench/main.swift 11, CortexRenderBench/GPUTimeHistogram.swift 11. (Phase 10 / D-18)
  min_length:
    warning: 1
    error: 0

nesting:
  # `CodingKeys` is a nested type the LANGUAGE requires: it must be declared inside the type whose
  # coding it describes. `LatencyHistogram.Summary.CodingKeys` therefore sits two levels deep and
  # trips a rule about avoiding deep type hierarchies, for a declaration that cannot be moved. This
  # is SwiftLint's own opt-out for that false positive; every other kind of second-level nested type
  # still fails. Drove: Packages/CortexDecoder/Sources/CortexDecoder/LatencyHistogram.swift:125,
  # introduced by Plan 10-16's CodingKeys work. (Phase 10 / D-18)
  ignore_coding_keys: true

file_length:
  # Count CODE lines, not documentation. The thresholds are UNCHANGED (400 / 1000 by default); this
  # only stops a file's doc comments from counting toward "this file does too much", which is what
  # the rule is actually about. It matters here because this repo documents heavily: the six files
  # over the limit carry 108-212 comment-only lines each, and three of them come back under 400 on
  # code alone -- ClosedLoopPipeline.swift 499 -> 287, ReplayExport.swift 408 -> 285,
  # CortexDemoBench/main.swift 494 -> 386. The other three are handled with a scoped disable/enable
  # pair in the file itself rather than by moving this number. (Phase 10 / D-18)
  ignore_comment_only_lines: true
